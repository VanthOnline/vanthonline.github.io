<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vanth Online — development news and project progress.">
  <title>Vanth Online — Development News</title>
  <style>
    :root {color-scheme:dark}
    * {box-sizing:border-box}
    body {margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% 20%,#29374b,#0b1019 70%); color:#e8dfc9; font:18px/1.7 Georgia,serif}
    main {max-width:720px; padding:3rem 1.5rem; text-align:center}
    h1 {font-size:clamp(2.8rem,8vw,5rem); letter-spacing:.035em; margin:0; color:#f1d89f}
    p {margin:1rem 0}
    .eyebrow {font:600 .75rem/1.6 system-ui,sans-serif; letter-spacing:.25em; color:#b9c6d6; text-transform:uppercase}
    .rule {height:1px; max-width:260px; margin:2rem auto; background:linear-gradient(90deg,transparent,#987d4b,transparent)}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A world in development</p>
    <h1>Vanth Online</h1>
    <div class="rule"></div>
    <p>Development news, milestones, and the story of a world taking shape.</p>
    <p class="eyebrow">The development journal is coming soon.</p>
  </main>
</body>
</html>
